{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Detector</title>
    <link href="{% static 'scanner/style.css' %}" rel="stylesheet">
</head>

<body>
    <div class="top-bar">
        <div class="brand">Energy Detector</div>
        <div class="actions">
            <a href="/admin/" class="btn-link">Admin</a>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="content-box">
                <h3>Настройка діапазону</h3>
                <form id="scanForm">
                    <div class="form-group">
                        <label>Початкова частота (MHz)</label>
                        <input type="number" step="0.1" class="simple-input" id="startFreq" value="88.0" required>
                    </div>
                    <div class="form-group">
                        <label>Кінцева частота (MHz)</label>
                        <input type="number" step="0.1" class="simple-input" id="stopFreq" value="108.0" required>
                    </div>
                    <button type="submit" class="std-btn btn-blue w-100" id="btnScan">Просканувати</button>
                </form>

                <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">

                <h3>Розклад сканування</h3>
                <div class="flex-row">
                    <div class="col-half">
                        <input type="number" class="simple-input" id="scheduleInterval" value="1">
                    </div>
                    <div class="col-half">
                        <select class="simple-select" id="scheduleIntervalUnit">
                            <option value="minutes">Хвилини</option>
                            <option value="hours">Години</option>
                            <option value="days">Дні</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top: 10px;">
                    <button class="std-btn btn-green w-100" id="btnSchedule">Почати</button>
                    <button class="std-btn btn-red w-100 hidden" id="btnStopSchedule">Зупинити</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="content-box">
                <div class="panel-header" style="display: flex; justify-content: space-between;">
                    <span>Результат сканування</span>
                    <small style="color: #666;" id="lastUpdated">-</small>
                </div>

                <div class="result-area">
                    <div id="scanLoader" class="hidden" style="text-align: center;">
                        <div class="loader"></div>
                        <p style="margin-top: 10px; color: #ccc;">Cканую...</p>
                    </div>
                    <img id="resultImage" src="" class="hidden" alt="Spectrum">
                    <div id="placeholderText" style="text-align: center;"></div>
                </div>
            </div>
        </div>

        <div style="width: 100%;">
            <div class="content-box">
                <div class="panel-header">
                    Історія сканувань
                </div>
                <table class="simple-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Час</th>
                            <th>Діапазон (MHz)</th>
                            <th>Результат</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="imageModal" class="basic-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 style="margin-top: 0;">Scan Detail</h3>
            <div style="text-align: center;">
                <img id="modalImage" src="" style="max-width: 100%;" alt="Full Resolution Scan">
            </div>
        </div>
    </div>

    <script>
        // CSRF Setup
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        // State
        let schedulerId = null;
        let isScanning = false;

        // Elements
        const scanForm = document.getElementById('scanForm');
        const btnScan = document.getElementById('btnScan');
        const resultImage = document.getElementById('resultImage');
        const placeholderText = document.getElementById('placeholderText');
        const scanLoader = document.getElementById('scanLoader');
        const historyTableBody = document.getElementById('historyTableBody');

        const btnSchedule = document.getElementById('btnSchedule');
        const btnStopSchedule = document.getElementById('btnStopSchedule');
        const scheduleInterval = document.getElementById('scheduleInterval');
        const scheduleIntervalUnit = document.getElementById('scheduleIntervalUnit');

        // Init
        loadHistory();

        // Event Listeners
        scanForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await performScan();
        });

        btnSchedule.addEventListener('click', () => {
            let interval = parseInt(scheduleInterval.value);
            const unit = scheduleIntervalUnit.value;

            // Convert to ms
            if (unit === 'seconds') interval *= 1000;
            if (unit === 'minutes') interval *= 60000;
            if (unit === 'hours') interval *= 3600000;
            if (unit === 'days') interval *= 86400000;

            if (interval < 1000) {
                alert("Minimum interval is 1 second");
                return;
            }

            startScheduler(interval);
        });

        btnStopSchedule.addEventListener('click', () => {
            stopScheduler();
        });

        // Functions
        async function performScan() {
            if (isScanning) return;
            setScanning(true);

            const start = document.getElementById('startFreq').value;
            const stop = document.getElementById('stopFreq').value;

            const formData = new FormData();
            formData.append('start', start);
            formData.append('stop', stop);

            try {
                const response = await fetch('/api/scan/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrftoken
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'success') {
                    updateResult(data.scan);
                    loadHistory(); // Refresh history
                } else {
                    alert('Scan Failed: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Scan Error: ' + error.message);
            } finally {
                setScanning(false);
            }
        }

        function updateResult(scan) {
            resultImage.src = '/' + scan.image_url;
            resultImage.classList.remove('hidden');
            resultImage.style.display = 'block'; // Ensure display if mixed with class
            placeholderText.classList.add('hidden');
            document.getElementById('lastUpdated').innerText = 'Останнє сканування: ' + scan.created_at;
        }

        function setScanning(active) {
            isScanning = active;
            btnScan.disabled = active;
            if (active) {
                scanLoader.classList.remove('hidden');
                resultImage.classList.add('hidden');
                placeholderText.classList.add('hidden');
            } else {
                scanLoader.classList.add('hidden');
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/history/');
                const data = await response.json();

                if (data.status === 'success') {
                    renderHistory(data.history);
                }
            } catch (error) {
                console.error('History load failed', error);
            }
        }

        function renderHistory(scans) {
            historyTableBody.innerHTML = scans.map(s => `
            <tr>
                <td>${s.id}</td>
                <td>${s.created_at}</td>
                <td>${s.start} - ${s.stop}</td>
                <td>
                    <button class="std-btn btn-blue btn-sm" onclick="viewImage('/${s.image_url}')">Подивитись</button>
                </td>
            </tr>
        `).join('');
        }

        // Modal Functions
        window.viewImage = function (url) {
            const modal = document.getElementById('imageModal');
            document.getElementById('modalImage').src = url;
            modal.style.display = "block";
        }

        window.closeModal = function () {
            document.getElementById('imageModal').style.display = "none";
        }

        // Close modal if clicked outside
        window.onclick = function (event) {
            const modal = document.getElementById('imageModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Scheduler
        function startScheduler(interval) {
            if (schedulerId) clearInterval(schedulerId);

            btnSchedule.classList.add('hidden');
            btnStopSchedule.classList.remove('hidden');
            scheduleInterval.disabled = true;

            performScan(); // Immediate scan
            schedulerId = setInterval(performScan, interval);
        }

        function stopScheduler() {
            if (schedulerId) {
                clearInterval(schedulerId);
                schedulerId = null;
            }

            btnSchedule.classList.remove('hidden');
            btnStopSchedule.classList.add('hidden');
            scheduleInterval.disabled = false;
        }
    </script>

</body>

</html>
